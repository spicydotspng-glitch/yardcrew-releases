name: Bug report
description: Something in YardCrew did not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste passwords, tokens, API keys or private files here.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS (Apple Silicon), Windows 10, Windows 11]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: YardCrew version
      placeholder: 0.1.0-alpha.0
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: Settings → Diagnostics → Copy gives a redacted report of the app's own state.
      render: text
