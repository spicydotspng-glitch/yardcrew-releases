name: Bug report
description: Something in YardCrew did not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste passwords, tokens, API keys or private files here.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS (Apple Silicon), Windows 10, Windows 11]
    validations: { required: true }
  - type: dropdown
    id: mode
    attributes:
      label: Worker computer
      options:
        - Isolated Linux (Docker Desktop)
        - Isolated Linux (OrbStack)
        - Isolated Linux (Colima)
        - Host mode
        - Not sure
  - type: input
    id: version
    attributes:
      label: YardCrew version
      description: Settings → About shows it
      placeholder: 0.1.0-alpha.1
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: Settings → Diagnostics → Preview, then Copy. It contains no task text, files, or sign-ins; read it before you paste.
      render: text
