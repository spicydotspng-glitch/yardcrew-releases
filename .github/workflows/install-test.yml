# Installs a published release on clean GitHub-hosted machines and runs YardCrew's built-in self-check.
# The self-check never signs in: it uses a fresh, empty Codex home.
name: Install test
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test
        required: true
        default: v0.1.0-alpha.1
  release:
    types: [published]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download installer and checksum
        run: gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "*x64.exe*"
      - name: Verify SHA-256
        run: |
          $exe = Get-ChildItem *.exe | Select-Object -First 1
          $want = (Get-Content "$($exe.Name).sha256").Split(" ")[0].Trim()
          $got = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "want $want"; "got  $got"
          if ($want -ne $got) { throw "checksum mismatch" }
      - name: Silent per-user install
        run: |
          $exe = Get-ChildItem *.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList "/S" -Wait
          $dir = "$env:LOCALAPPDATA\Programs\YardCrew"
          if (-not (Test-Path "$dir\YardCrew.exe")) { throw "YardCrew.exe not installed" }
          Get-ChildItem $dir | Select-Object Name, Length
          Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\YardCrew" | Select-Object DisplayName, DisplayVersion, Publisher
      - name: Self-check
        run: |
          $env:ELECTRON_RUN_AS_NODE = 1
          & "$env:LOCALAPPDATA\Programs\YardCrew\YardCrew.exe" "$env:LOCALAPPDATA\Programs\YardCrew\resources\app\selfcheck.cjs" | Tee-Object selfcheck.txt
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          if (-not (Select-String -Path selfcheck.txt -Pattern "ALL CHECKS PASSED" -Quiet)) { throw "self-check failed" }
      - name: App starts and stays up
        run: |
          $p = Start-Process "$env:LOCALAPPDATA\Programs\YardCrew\YardCrew.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "YardCrew exited with code $($p.ExitCode)" }
          Get-Process YardCrew | Select-Object Id, WorkingSet64, MainWindowTitle
          Stop-Process -Name YardCrew -Force
      - name: Without Docker's Linux engine, the worker computer reports what is missing and offers host mode
        # The runner has no Linux container engine. The app must start in Isolated Linux, say the worker computer
        # is not ready, and offer host mode, without crashing. Driven over the Chrome DevTools Protocol.
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "yardcrew-ci-data"
          $env:YARDCREW_DATA_DIR = $data
          $p = Start-Process "$env:LOCALAPPDATA\Programs\YardCrew\YardCrew.exe" -ArgumentList "--remote-debugging-port=9333" -PassThru
          @'
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          let page;
          for (let i = 0; i < 60 && !page; i++) {
            try { page = (await (await fetch("http://127.0.0.1:9333/json")).json()).find((t) => t.type === "page"); } catch {}
            if (!page) await sleep(1000);
          }
          if (!page) throw new Error("no renderer page");
          const ws = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((r) => ws.addEventListener("open", r));
          let id = 0;
          const ev = (expression) => new Promise((resolve) => {
            const me = ++id;
            ws.addEventListener("message", function on(e) { const m = JSON.parse(e.data); if (m.id === me) { ws.removeEventListener("message", on); resolve(m.result?.result?.value); } });
            ws.send(JSON.stringify({ id: me, method: "Runtime.evaluate", params: { expression, awaitPromise: true, returnByValue: true } }));
          });
          await sleep(6000);
          const info = await ev(`window.crew.invoke("app.info")`);
          const status = await ev(`window.crew.invoke("computer.status")`);
          const text = await ev(`document.body.innerText`);
          console.log(JSON.stringify({ version: info?.appVersion, mode: info?.executionMode, backend: status?.backend, image: status?.image, network: status?.network }, null, 1));
          if (info?.executionMode !== "isolated-linux") throw new Error("expected Isolated Linux by default");
          if (!status || status.image === true) throw new Error("expected the worker computer to be not ready on this runner");
          if (!/host mode/i.test(text ?? "")) throw new Error("host mode is not offered on the first-run screen");
          console.log("PASS worker computer not ready; host mode offered; app alive");
          process.exit(0);
          '@ | Set-Content -Path ci-cdp.mjs
          node ci-cdp.mjs
          $code = $LASTEXITCODE
          if ($p.HasExited) { throw "YardCrew exited with code $($p.ExitCode)" }
          Stop-Process -Name YardCrew -Force
          if ($code -ne 0) { throw "worker computer check failed" }
      - name: Silent uninstall keeps user data by default
        run: |
          Start-Process "$env:LOCALAPPDATA\Programs\YardCrew\Uninstall YardCrew.exe" -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5
          if (Test-Path "$env:LOCALAPPDATA\Programs\YardCrew\YardCrew.exe") { throw "app files remain after uninstall" }
          "uninstalled"

  macos:
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Download disk image and checksum
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*arm64.dmg*"
      - name: Verify SHA-256
        run: shasum -a 256 -c *.dmg.sha256
      - name: Mount and copy to Applications
        run: |
          hdiutil attach -nobrowse -mountpoint /Volumes/YardCrew *.dmg
          cp -R /Volumes/YardCrew/YardCrew.app /Applications/
          hdiutil detach /Volumes/YardCrew
          codesign --verify --deep --strict --verbose=2 /Applications/YardCrew.app || true
      - name: Self-check
        run: |
          ELECTRON_RUN_AS_NODE=1 /Applications/YardCrew.app/Contents/MacOS/YardCrew /Applications/YardCrew.app/Contents/Resources/app/selfcheck.cjs | tee selfcheck.txt
          grep -q "ALL CHECKS PASSED" selfcheck.txt
